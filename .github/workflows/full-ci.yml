name: Full CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: 저장소 구조 검사
        run: ./scripts/check-repo.sh

      - name: 문서 검사
        run: ./scripts/check-docs.sh

      - name: Flyway migration 검사
        run: ./scripts/check-migrations.sh

      - name: Docker Compose 검사
        run: ./scripts/verify-compose.sh

  backup-docker-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Backup Docker executable authority 검증
        run: ./scripts/verify-backup-docker-authority.sh

  backend:
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    uses: ./.github/workflows/frontend-ci.yml

  production-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Production runtime 검증
        run: ./scripts/verify-production-runtime.sh

  production-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Production Household bootstrap 검증
        run: ./scripts/verify-production-bootstrap.sh

  fresh-host-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Fresh-host bootstrap transaction 검증
        run: ./scripts/verify-fresh-host-bootstrap.sh

  host-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Host state/shared operation lock 검증
        run: ./scripts/verify-host-state.sh

  fixed-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Fixed backup/offsite bootstrap source 검증
        run: ./scripts/verify-fixed-bootstrap.sh

  runtime-config-evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Runtime-config evolution bridge 검증
        run: ./scripts/verify-runtime-config-evolution.sh

  host-deploy-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Restricted host deployment transaction 검증
        run: ./scripts/verify-host-deploy-transaction.sh

  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Backup/Restore 검증
        run: ./scripts/verify-backup-restore.sh

  offsite-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Encrypted offsite backup source 검증
        run: ./scripts/verify-offsite-backup.sh

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Observability/status 검증
        run: ./scripts/verify-observability.sh

  monitor-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Monitor policy/HomeOps 검증
        run: ./scripts/verify-monitor-policy.sh

  release-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Release/Deploy source 검증
        run: ./scripts/verify-release-transport.sh
