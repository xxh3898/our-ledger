name: Release Source Harness

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sync_runtime_config:
        description: Force runtime config publication and synchronization
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: our-ledger-production
  cancel-in-progress: false

env:
  API_IMAGE_NAME: ghcr.io/xxh3898/our-ledger-api
  WEB_IMAGE_NAME: ghcr.io/xxh3898/our-ledger-web
  RUNTIME_CONFIG_IMAGE_NAME: ghcr.io/xxh3898/our-ledger-runtime-config

jobs:
  validate:
    name: Validate release
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/full-ci.yml
    permissions:
      contents: read

  publish:
    name: Publish ARM64 artifacts
    if: github.ref == 'refs/heads/main' && vars.OUR_LEDGER_DEPLOY_ENABLED == 'true'
    needs:
      - validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
      packages: write
    outputs:
      runtime_config_mode: ${{ steps.runtime-config-mode.outputs.mode }}
      runtime_config_digest: ${{ steps.publish-runtime-config.outputs.digest }}

    steps:
      - name: Check out full release history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve last successful production revision
        id: deployed-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          deployments="$(
            curl \
              --fail \
              --retry 3 \
              --silent \
              --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=30"
          )"
          deployed_sha=0000000000000000000000000000000000000000
          while IFS=$'\t' read -r deployment_id candidate_sha; do
            state="$(
              curl \
                --fail \
                --retry 3 \
                --silent \
                --show-error \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=1" \
                | jq -r '.[0].state // empty'
            )"
            if [[ "${state}" == success ]]; then
              deployed_sha="${candidate_sha}"
              break
            fi
          done < <(jq -r '.[] | [.id, .sha] | @tsv' <<<"${deployments}")
          if [[ ! "${deployed_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Previous production revision has an unexpected format\n' >&2
            exit 64
          fi
          printf 'sha=%s\n' "${deployed_sha}" >>"${GITHUB_OUTPUT}"

      - name: Detect runtime config changes
        id: runtime-config-mode
        env:
          DEPLOYED_SHA: ${{ steps.deployed-base.outputs.sha }}
          FORCE_SYNC: ${{ inputs.sync_runtime_config || false }}
        run: |
          mode="$(
            ./scripts/detect-runtime-config-change.sh \
              "${DEPLOYED_SHA}" \
              "${GITHUB_SHA}" \
              "${FORCE_SYNC}"
          )"
          printf 'mode=%s\n' "${mode}" >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API ARM64 image
        id: publish-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=our-ledger-api-arm64
          cache-to: type=gha,mode=max,scope=our-ledger-api-arm64

      - name: Build and publish Web ARM64 image
        id: publish-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=our-ledger-web-arm64
          cache-to: type=gha,mode=max,scope=our-ledger-web-arm64

      - name: Build and publish runtime config ARM64 image
        id: publish-runtime-config
        if: steps.runtime-config-mode.outputs.mode == 'update'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: runtime-config.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.RUNTIME_CONFIG_IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=our-ledger-runtime-config-arm64
          cache-to: type=gha,mode=max,scope=our-ledger-runtime-config-arm64

      - name: Validate published digest contract
        env:
          API_IMAGE_DIGEST: ${{ steps.publish-api.outputs.digest }}
          WEB_IMAGE_DIGEST: ${{ steps.publish-web.outputs.digest }}
          RUNTIME_CONFIG_MODE: ${{ steps.runtime-config-mode.outputs.mode }}
          RUNTIME_CONFIG_DIGEST: ${{ steps.publish-runtime-config.outputs.digest }}
        run: |
          python3 ./scripts/release_tools/release_contract.py \
            validate-publish \
            --revision "${GITHUB_SHA}" \
            --api-digest "${API_IMAGE_DIGEST}" \
            --web-digest "${WEB_IMAGE_DIGEST}" \
            --mode "${RUNTIME_CONFIG_MODE}" \
            --runtime-config-digest "${RUNTIME_CONFIG_DIGEST}" \
            >/dev/null

  deploy:
    name: Transport release intent
    if: github.ref == 'refs/heads/main' && vars.OUR_LEDGER_DEPLOY_ENABLED == 'true'
    needs:
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Check out restricted command source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          hostname: our-ledger-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          ping: home-mini

      - name: Configure restricted SSH identity
        env:
          HOME_MINI_SSH_KEY: ${{ secrets.HOME_MINI_SSH_KEY }}
          HOME_MINI_KNOWN_HOSTS: ${{ secrets.HOME_MINI_KNOWN_HOSTS }}
        run: |
          test -n "${HOME_MINI_SSH_KEY}"
          test -n "${HOME_MINI_KNOWN_HOSTS}"
          umask 077
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${HOME_MINI_SSH_KEY}" >"${HOME}/.ssh/id_ed25519_home_mini_ci"
          printf '%s\n' "${HOME_MINI_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/id_ed25519_home_mini_ci" >/dev/null
          ssh-keygen -lf "${HOME}/.ssh/known_hosts" >/dev/null

      - name: Send fixed deployment intent
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNTIME_CONFIG_MODE: ${{ needs.publish.outputs.runtime_config_mode }}
          RUNTIME_CONFIG_DIGEST: ${{ needs.publish.outputs.runtime_config_digest }}
        run: |
          set -Eeuo pipefail

          deploy_command="$(
            python3 ./scripts/release_tools/release_contract.py \
              build-command \
              --revision "${GITHUB_SHA}" \
              --mode "${RUNTIME_CONFIG_MODE}" \
              --runtime-config-digest "${RUNTIME_CONFIG_DIGEST}" \
              --actor "${GITHUB_ACTOR}"
          )"
          printf '%s' "${GHCR_TOKEN}" \
            | ssh \
                -F /dev/null \
                -i "${HOME}/.ssh/id_ed25519_home_mini_ci" \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                homeserver@home-mini \
                "${deploy_command}"
