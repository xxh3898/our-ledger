name: dev-our-ledger

services:
  postgres:
    image: postgres:18.6-alpine3.23
    cpus: 1.0
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-our_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-our_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.dev.local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    profiles: ["app"]
    image: gradle:9.7.1-jdk25-alpine
    cpus: 2.0
    mem_limit: 2g
    working_dir: /workspace
    user: root
    environment:
      GRADLE_USER_HOME: /home/gradle/.gradle
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-our_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-our_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.dev.local}
      OUR_LEDGER_BOOTSTRAP_ENABLED: ${OUR_LEDGER_BOOTSTRAP_ENABLED:-false}
      OUR_LEDGER_BOOTSTRAP_HOUSEHOLD_NAME: ${OUR_LEDGER_BOOTSTRAP_HOUSEHOLD_NAME:-}
      OUR_LEDGER_BOOTSTRAP_OWNER_EMAIL: ${OUR_LEDGER_BOOTSTRAP_OWNER_EMAIL:-}
      OUR_LEDGER_BOOTSTRAP_OWNER_DISPLAY_NAME: ${OUR_LEDGER_BOOTSTRAP_OWNER_DISPLAY_NAME:-}
      OUR_LEDGER_BOOTSTRAP_MEMBER_EMAIL: ${OUR_LEDGER_BOOTSTRAP_MEMBER_EMAIL:-}
      OUR_LEDGER_BOOTSTRAP_MEMBER_DISPLAY_NAME: ${OUR_LEDGER_BOOTSTRAP_MEMBER_DISPLAY_NAME:-}
    command:
      - /bin/sh
      - -c
      - >-
        chown gradle:gradle /home/gradle/.gradle /workspace/.gradle /workspace/build &&
        exec su gradle -s /bin/sh -c 'exec ./gradlew --no-daemon bootRun'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend/src:/workspace/src:ro
      - ./backend/build.gradle.kts:/workspace/build.gradle.kts:ro
      - ./backend/settings.gradle.kts:/workspace/settings.gradle.kts:ro
      - ./backend/gradle.properties:/workspace/gradle.properties:ro
      - ./backend/gradlew:/workspace/gradlew:ro
      - ./backend/gradle:/workspace/gradle:ro
      - backend-gradle-cache:/home/gradle/.gradle
      - backend-project-cache:/workspace/.gradle
      - backend-build:/workspace/build

  web:
    profiles: ["app"]
    image: node:24-bookworm-slim
    cpus: 1.0
    mem_limit: 1g
    working_dir: /workspace
    user: root
    environment:
      BACKEND_ORIGIN: http://api:8080
      OUR_LEDGER_LOCAL_IDENTITY_EMAIL: ${OUR_LEDGER_LOCAL_IDENTITY_EMAIL:-}
      NPM_CONFIG_CACHE: /home/node/.npm
    command:
      - /bin/sh
      - -c
      - >-
        chown node:node /workspace/node_modules /home/node/.npm &&
        exec runuser -u node -- /bin/sh -c
        'npm ci && exec npm run dev -- --host 0.0.0.0'
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/workspace/src:ro
      - ./frontend/index.html:/workspace/index.html:ro
      - ./frontend/package.json:/workspace/package.json:ro
      - ./frontend/package-lock.json:/workspace/package-lock.json:ro
      - ./frontend/tsconfig.json:/workspace/tsconfig.json:ro
      - ./frontend/tsconfig.app.json:/workspace/tsconfig.app.json:ro
      - ./frontend/tsconfig.node.json:/workspace/tsconfig.node.json:ro
      - ./frontend/vite.config.ts:/workspace/vite.config.ts:ro
      - frontend-node-modules:/workspace/node_modules
      - frontend-npm-cache:/home/node/.npm

volumes:
  postgres-data:
    name: dev-our-ledger-postgres-data
  backend-gradle-cache:
    name: dev-our-ledger-gradle-cache
  backend-project-cache:
    name: dev-our-ledger-gradle-project-cache
  backend-build:
    name: dev-our-ledger-backend-build
  frontend-node-modules:
    name: dev-our-ledger-frontend-node-modules
  frontend-npm-cache:
    name: dev-our-ledger-frontend-npm-cache
